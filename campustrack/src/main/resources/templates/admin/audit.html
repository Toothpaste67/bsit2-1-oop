<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('System Audit Log')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<div class="app">
  <aside th:replace="~{fragments/layout :: sidebar('audit')}"></aside>

  <main class="content">
    <div class="page-head">
      <div>
        <h1>System Audit Log</h1>
        <p>Newest first. Logins, account changes, attendance edits, sessions, reservations and item status changes.</p>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="table cards">
          <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead>
          <tbody>
          <tr th:each="e : ${entries}">
            <td data-label="When" th:text="${#temporals.format(e.timestamp, 'MMM d, yyyy h:mm:ss a')}"></td>
            <td data-label="Who" th:text="${e.actor}"></td>
            <td data-label="Action"><span class="badge b-gray" th:text="${e.action}"></span></td>
            <td data-label="Details" th:text="${e.details}"></td>
          </tr>
          <tr th:if="${entries.isEmpty()}"><td colspan="4" class="empty">Nothing logged yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<nav th:replace="~{fragments/layout :: bottomnav('audit')}"></nav>
</body>
</html>
