<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Not Found')}"></head>
<body>
<main class="error-page">
  <div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p th:text="${message} ?: 'The page or record you are looking for does not exist or has been removed.'">Not found.</p>
    <a class="btn" th:href="@{/dashboard}">Back to my dashboard</a>
  </div>
</main>
</body>
</html>
