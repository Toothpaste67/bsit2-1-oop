<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<main class="error-page">
  <div>
    <div class="code" th:text="${code} ?: 500">500</div>
    <h1>Something went wrong</h1>
    <p>The request could not be completed. Go back and try again; if it keeps happening, tell the administrator.</p>
    <a class="btn" th:href="@{/dashboard}">Back to my dashboard</a>
  </div>
</main>
</body>
</html>
