# ---------------------------------------------------------------------------
# CampusTrack is DATABASE-FREE. All records live in custom data structures
# (see com.liceo.campustrack.datastructure) and are saved to plain .txt files.
# ---------------------------------------------------------------------------

# Folder that holds users.txt, attendance.txt, reservations.txt, ...
campustrack.data-dir=${CAMPUSTRACK_DATA_DIR:data}

# HTTPS (phones only allow camera access on secure pages)
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=campustrack
server.ssl.key-store-password=${CAMPUSTRACK_KEYSTORE_PASSWORD:campustrack}

# Extra plain-HTTP port, reachable from this computer only (http://localhost:8080)
campustrack.http-port=8080

# Attendance rules
campustrack.attendance.late-after-minutes=15

# Passwords of the default test accounts created on first run.
# Override them with environment variables before a real deployment.
campustrack.seed.admin-password=${CAMPUSTRACK_ADMIN_PASSWORD:Admin123}
campustrack.seed.faculty-password=${CAMPUSTRACK_FACULTY_PASSWORD:Faculty123}
campustrack.seed.student-password=${CAMPUSTRACK_STUDENT_PASSWORD:Student123}

# Uploads (lost & found photos, QR image fallback)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Our own error pages (templates/error/*.html)
server.error.whitelabel.enabled=false
